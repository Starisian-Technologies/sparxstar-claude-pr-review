name: Claude PR Review

# Prerequisites in the consumer repo / org:
#   - Secret  ANTHROPIC_API_KEY             — Anthropic Messages API key.
#   - Secret  COMPOSER_RESOLVER_PRIVATE_KEY — composer-resolver GitHub App private key.
#   - Variable COMPOSER_RESOLVER_CLIENT_ID  — composer-resolver GitHub App client id
#                                             (org-level variable; read by the
#                                             reusable workflow via the vars context).

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Job 1: fetch specs, contracts, and ADRs declared in sparxstar-specs.yml.
  # Produces artifact "sparxstar-specs" containing:
  #   .sparxstar/specs/agent/   — repo spec at agent_ref (always main)
  #   .sparxstar/contracts/     — cross-repo contracts this repo is party to
  #   .sparxstar/adrs/          — ADRs that govern this repo
  # Scope is read from sparxstar-specs.yml at repo root — not hardcoded here.
  fetch-specs:
    permissions:
      contents: read
    # Pin to the immutable release tag @v1.0.0; @v1 is the moving major alias.
    uses: Starisian-Technologies/sparxstar-product-specification-registry/.github/workflows/fetch-specs.yml@v1.0.0
    # No secrets block needed — read token minted from the org-level composer-resolver GitHub App.

  # Job 2: three-pass Claude review consuming the fetched artifact.
  review:
    needs: fetch-specs
    permissions:
      contents: read
      pull-requests: write
    # Pin an immutable release tag (current default @v1.1.1). There is no @v1
    # moving alias published — don't pin @v1. Never reference @main.
    uses: Starisian-Technologies/sparxstar-claude-pr-review/.github/workflows/claude-pr-review.yml@v1.1.1
    with:
      # Tag of the ADR / product-spec registries to review against. Pin a real
      # registry tag; the registry checkout fails if it doesn't exist. This gate
      # validates ref shape only and does not enforce a version floor.
      contract_ref: v1.0.0
    secrets:
      # Pass each secret by name (not `secrets: inherit`).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COMPOSER_RESOLVER_PRIVATE_KEY: ${{ secrets.COMPOSER_RESOLVER_PRIVATE_KEY }}
    # specs-artifact input defaults to "sparxstar-specs" — matches fetch-specs.yml output.
